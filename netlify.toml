# Netlify 설정
# 이 저장소를 Netlify에 연결하면 site 폴더가 그대로 배포됩니다.
# (git push 할 때마다 자동 배포 — 드래그앤드롭이 더 이상 필요 없습니다)
#
# 연결 방법: Netlify → Project configuration → Build & deploy → Link repository
# 빌드 과정이 없는 정적 사이트라 build 명령은 비워 둡니다.

[build]
  publish = "site"
  command = ""

# 예전 주소 호환 — 개편 전 페이지로 들어오면 새 페이지로 보낸다
[[redirects]]
  from = "/services.html"
  to = "/products.html"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/"
  status = 301

# 광고용 짧은 주소
[[redirects]]
  from = "/q"
  to = "/quote.html"
  status = 301
